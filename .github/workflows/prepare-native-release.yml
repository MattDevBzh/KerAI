name: Prepare validated native patch release
on:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-native-release.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare the targeted fix, regression tests and version 1.25.2
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const assert = require('node:assert/strict');
          const version = '1.25.2';
          const sourcePath = 'src/host/NativeCopilot.ts';
          let source = fs.readFileSync(sourcePath, 'utf8');
          const old = `  // Copilot can expose grep, rg, or both for the same search capability.
            const required = readOnly
              ? ['view', 'glob', 'ask_user']
              : ['view', 'glob', 'edit', 'create', 'ask_user'];`;
          const replacement = `  // Some models expose apply_patch instead of edit/create. It covers both write capabilities.
            // Keep read-only validation strict: apply_patch remains outside NATIVE_READ_TOOLS.
            const required =
              readOnly || names.includes('apply_patch')
                ? ['view', 'glob', 'ask_user']
                : ['view', 'glob', 'edit', 'create', 'ask_user'];`;
          assert.ok(source.includes(old), 'Expected native validation block is missing; refuse to guess.');
          fs.writeFileSync(sourcePath, source.replace(old, replacement));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.version, '1.25.1');
          pkg.version = version;
          assert.ok(pkg.scripts.package.includes('feature-studio-1.25.1.vsix'));
          pkg.scripts.package = pkg.scripts.package.replace('feature-studio-1.25.1.vsix', `feature-studio-${version}.vsix`);
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          assert.equal(lock.version, '1.25.1');
          assert.equal(lock.packages[''].version, '1.25.1');
          // The preceding bump replaced every 1.25.0 string, including a dependency's metadata.
          // Restore only this accidental version change when all other locked fields match.
          const original = JSON.parse(execFileSync('git', ['show', '8e21a90f4042fb785a3d2b845ae4643195923520:package-lock.json'], { encoding: 'utf8' }));
          for (const [name, entry] of Object.entries(lock.packages)) {
            if (!name) continue;
            const before = original.packages[name];
            assert.ok(before, `Unexpected dependency ${name}`);
            if (entry.version !== before.version) {
              assert.equal(entry.version, '1.25.1');
              assert.equal(before.version, '1.25.0');
              assert.deepEqual({ ...entry, version: before.version }, before);
              entry.version = before.version;
              console.log(`Restored unchanged dependency metadata: ${name}@${before.version}`);
            }
            assert.deepEqual(entry, before, `Unexpected dependency change: ${name}`);
          }
          lock.version = version;
          lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          const ciPath = '.github/workflows/ci.yml';
          const ci = fs.readFileSync(ciPath, 'utf8');
          const testCommand = 'npx vitest run tests/subplans.test.ts tests/native.test.ts';
          assert.ok(ci.includes(testCommand), 'Windows native-test command was not found');
          fs.writeFileSync(ciPath, ci.replace(testCommand, testCommand + ' tests/native-patch.test.ts'));
          const entry = `## ${version} — 2026-10-22 · Compatibilité native apply_patch\n\n- Accepte les catalogues qui exposent \`apply_patch\` à la place de \`edit\` et \`create\`, tout en conservant les contrôles de lecture, recherche, terminal, questions, doublons et outils autorisés.\n- Garde les outils d’écriture et de terminal interdits en lecture seule.\n- Ajoute des tests du catalogue Windows signalé, des alternatives d’écriture et du diagnostic sans appel modèle, exécutés sous Linux et Windows.\n- Synchronise les versions du manifeste, du lockfile et du VSIX. Restaure la seule métadonnée de dépendance altérée par le précédent changement de version, sans mise à jour des dépendances.\n\n`;
          const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
          assert.ok(changelog.startsWith('# Changelog\n\n'));
          fs.writeFileSync('CHANGELOG.md', '# Changelog\n\n' + entry + changelog.slice('# Changelog\n\n'.length));
          fs.writeFileSync(`docs/releases/v${version}.md`, `# Feature Studio ${version} — Compatibilité native apply_patch\n\nCorrige le refus de démarrage lorsque Copilot expose \`apply_patch\` sans \`edit\` ni \`create\`. Certains modèles utilisent cet outil de patch pour les deux capacités d’écriture.\n\nLe catalogue complet accepte désormais \`apply_patch\` **ou** la présence conjointe de \`edit\` et \`create\`. La lecture, la recherche, le terminal et les questions humaines restent requis. Les doublons, outils inattendus et outils d’écriture en lecture seule restent refusés ; les permissions sont inchangées.\n\nLes tests incluent le catalogue Windows signalé, les variantes bash/powershell et grep/rg, les catalogues incomplets, la lecture seule et le diagnostic sans prompt.\n\nVersions du manifeste, du lockfile et du VSIX : **${version}**. Aucun changement de version du SDK Copilot ou du CLI. Prettier reste non bloquant dans la CI.\n\nInstaller \`feature-studio-${version}.vsix\`, recharger VS Code, puis relancer **Vérifier Copilot** et l’agent concerné.\n`);
          console.log(`Prepared Feature Studio ${version} with unchanged dependency resolutions.`);

          fs.writeFileSync('tests/native-patch.test.ts', String.raw`import { describe, expect, it, vi } from 'vitest';
          import type { CopilotClient } from '@github/copilot-sdk';
          import { probeNativeCapabilities, verifyNativeCatalog } from '../src/host/NativeCopilot';

          // Actual Windows catalog reported by the user, including the selected Studio host tool.
          const reportedCatalog = [
            'view',
            'glob',
            'rg',
            'apply_patch',
            'powershell',
            'read_powershell',
            'stop_powershell',
            'list_powershell',
            'ask_user',
            'studio_read_personal_resource',
          ];
          const hostTools = ['studio_read_personal_resource'];

          it('accepts the reported Windows patch catalog only with its explicit host tool', () => {
            expect(() => verifyNativeCatalog(reportedCatalog, hostTools)).not.toThrow();
            expect(() => verifyNativeCatalog(reportedCatalog)).toThrow(/inattendu/);
          });

          describe.each(['bash', 'powershell'])('native write alternatives (%s)', (shell) => {
            const base = ['view', 'glob', 'rg', 'ask_user', shell];

            it.each([
              { write: ['apply_patch'] },
              { write: ['edit', 'create'] },
              { write: ['apply_patch', 'edit'] },
              { write: ['apply_patch', 'create'] },
              { write: ['apply_patch', 'edit', 'create'] },
            ])('accepts complete write capabilities $write', ({ write }) => {
              expect(() => verifyNativeCatalog([...base, ...write])).not.toThrow();
            });

            it.each([{ write: [] }, { write: ['edit'] }, { write: ['create'] }])(
              'rejects incomplete write capabilities $write without apply_patch',
              ({ write }) => {
                expect(() => verifyNativeCatalog([...base, ...write])).toThrow(/absents/);
              },
            );

            it.each(['view', 'glob', 'rg', 'ask_user', 'shell'])(
              'still requires %s with apply_patch',
              (capability) => {
                const missing = capability === 'shell' ? shell : capability;
                expect(() =>
                  verifyNativeCatalog([...base.filter((name) => name !== missing), 'apply_patch']),
                ).toThrow(/absents/);
              },
            );

            it('still rejects unknown tools and duplicate patch tools', () => {
              expect(() => verifyNativeCatalog([...base, 'apply_patch', 'task'])).toThrow(/inattendu/);
              expect(() => verifyNativeCatalog([...base, 'apply_patch', 'apply_patch'])).toThrow(/dupliqué/);
            });
          });

          it.each([{ search: ['grep'] }, { search: ['rg'] }, { search: ['grep', 'rg'] }])(
            'accepts patch writing with search catalog $search',
            ({ search }) => {
              expect(() =>
                verifyNativeCatalog(['view', 'glob', ...search, 'ask_user', 'powershell', 'apply_patch']),
              ).not.toThrow();
            },
          );

          it.each(['apply_patch', 'edit', 'create', 'bash', 'powershell'])(
            'still forbids %s in read-only mode',
            (tool) => {
              expect(() => verifyNativeCatalog(['view', 'glob', 'rg', 'ask_user', tool], [], true)).toThrow(
                /inattendu/,
              );
            },
          );

          it('keeps the patch-session read-only catalog valid after removing write and shell tools', () => {
            expect(() =>
              verifyNativeCatalog(['view', 'glob', 'rg', 'ask_user', ...hostTools], hostTools, true),
            ).not.toThrow();
          });

          it.each([{ write: ['apply_patch'], available: true }, { write: [], available: false }])(
            'probes a patch runtime without sending a prompt (available=$available)',
            async ({ write, available }) => {
              const names = ['view', 'glob', 'rg', ...write, 'powershell', 'ask_user'];
              let mode = 'manual';
              const session = {
                sessionId: 'patch-probe',
                send: vi.fn(),
                disconnect: vi.fn(async () => {}),
                rpc: {
                  tools: {
                    initializeAndValidate: vi.fn(async () => {}),
                    getCurrentMetadata: vi.fn(async () => ({ tools: names.map((name) => ({ name })) })),
                    execute: vi.fn(),
                  },
                  managedSettings: { get: vi.fn(async () => ({ failClosed: false })) },
                  permissions: {
                    configure: vi.fn(async () => ({ success: true })),
                    setMode: vi.fn(async (input: { mode: string }) => {
                      mode = input.mode;
                      return { success: true, mode };
                    }),
                    getMode: vi.fn(async () => ({ mode })),
                  },
                },
              };
              const client = {
                createSession: vi.fn(async () => session),
                deleteSession: vi.fn(async () => {}),
              };
              const result = await probeNativeCapabilities(client as unknown as CopilotClient, '/fixture');
              expect(result.available).toBe(available);
              expect(result.tools).toEqual(names);
              if (available) {
                expect(result.permissionModes).toContain('manual');
                expect(result.error).toBeUndefined();
              } else {
                expect(result.error).toMatch(/edit, create/);
                expect(session.rpc.permissions.configure).not.toHaveBeenCalled();
              }
              expect(session.send).not.toHaveBeenCalled();
              expect(session.rpc.tools.execute).not.toHaveBeenCalled();
              expect(session.disconnect).toHaveBeenCalledOnce();
              expect(client.deleteSession).toHaveBeenCalledWith('patch-probe');
            },
          );
          `);
          NODE
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Format and verify the modified TypeScript files
        run: |
          npx --no-install prettier --write src/host/NativeCopilot.ts tests/native-patch.test.ts
          npx --no-install prettier --check src/host/NativeCopilot.ts tests/native-patch.test.ts
      - run: npm run check
      - name: Prepare a validated commit without moving main
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const repo = context.repo;
            const main = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (main.data.object.sha !== context.sha) throw new Error('main changed; refusing to prepare a stale release');
            const parent = await github.rest.git.getCommit({ ...repo, commit_sha: context.sha });
            const files = [
              'src/host/NativeCopilot.ts',
              'tests/native-patch.test.ts',
              'package.json',
              'package-lock.json',
              'CHANGELOG.md',
              'docs/releases/v1.25.2.md',
              '.github/workflows/ci.yml',
            ];
            const tree = [];
            for (const path of files) {
              const blob = await github.rest.git.createBlob({ ...repo, content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8' });
              tree.push({ path, mode: '100644', type: 'blob', sha: blob.data.sha });
            }
            tree.push({ path: '.github/workflows/prepare-native-release.yml', mode: '100644', type: 'blob', sha: null });
            const createdTree = await github.rest.git.createTree({ ...repo, base_tree: parent.data.tree.sha, tree });
            const commit = await github.rest.git.createCommit({
              ...repo,
              message: 'fix: accept native apply_patch catalogs (1.25.2)',
              tree: createdTree.data.sha,
              parents: [context.sha],
            });
            core.notice(`VALIDATED_RELEASE_COMMIT=${commit.data.sha}`);
            await core.summary.addHeading('Validated Feature Studio 1.25.2').addRaw(`Prepared commit: ${commit.data.sha}. Main was not moved. Full release CI must still run after promotion.`).write();
