name: Validate and package Feature Studio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run tests/copilot-path.test.ts tests/copilot-launcher.test.ts tests/adapter.test.ts tests/core-registry.test.ts tests/registry-migration.test.ts tests/host-policy.test.ts tests/git-review.test.ts tests/git-read.test.ts tests/context.test.ts
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delivered VSIX
        run: sha256sum -c releases/SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run test:ui
      - run: xvfb-run -a npm run test:extension
      - run: mkdir -p releases && npm run package
      - uses: actions/upload-artifact@v4
        if: vars.FEATURE_STUDIO_UPLOAD_ARTIFACTS == 'true'
        with:
          name: feature-studio-vsix
          path: releases/*.vsix
          retention-days: 7
