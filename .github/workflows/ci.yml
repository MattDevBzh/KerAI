name: Validate and package Feature Studio
on:
  push:
  pull_request:
permissions:
  contents: read
# One explicitly requested no-test publication. All other pushes and PRs keep the full gates.
env:
  FEATURE_STUDIO_SKIP_TESTS: >-
    ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' &&
        github.event.head_commit.message == 'feat: export agent reports as Markdown (1.16.1; publish without tests)' }}
jobs:
  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm install --prefix "${{ runner.temp }}/copilot-catalog" --no-audit --no-fund @github/copilot@1.0.102
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: npx vitest run tests/devops-cli-catalog.test.ts tests/native-runtime.test.ts tests/native-test-runtime.test.ts tests/native-context-runtime.test.ts tests/images-runtime.test.ts tests/task-board-runtime.test.ts
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
        env:
          FEATURE_STUDIO_CATALOG_CLI: ${{ runner.temp }}/copilot-catalog/node_modules/.bin/copilot.cmd
      - run: npx playwright install chromium
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - name: Verify navigation and task boards on Windows
        run: npx vitest run navigation- tests/task-board.test.ts
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - name: Verify session creation feedback on Windows
        run: >-
          npx playwright test tests/ui.spec.ts --grep "création Git sans équipe|création : activité" --workers=1
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - name: Verify automatic workflow controls on Windows
        run: npx playwright test tests/ui-autopilot.spec.ts --workers=1
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: npx vitest run tests/subplans.test.ts tests/native.test.ts tests/native-test-evidence.test.ts tests/native-patch.test.ts tests/team.test.ts tests/personal-review.test.ts tests/optional-steps.test.ts tests/core-store.test.ts tests/autopilot.test.ts tests/service.test.ts tests/conversation.test.ts tests/pair.test.ts tests/pair-service.test.ts tests/workflow-collaboration.test.ts tests/dashboard.test.ts tests/devops-tickets-api.test.ts tests/devops-controller.test.ts tests/workspaces.test.ts tests/workspace-service.test.ts tests/quests.test.ts tests/copilot-path.test.ts tests/copilot-launcher.test.ts tests/adapter.test.ts tests/discussions.test.ts tests/discussion-context.test.ts tests/core-registry.test.ts tests/registry-migration.test.ts tests/host-policy.test.ts tests/git-review.test.ts tests/git-read.test.ts tests/context.test.ts tests/kits.test.ts tests/devops-kit.test.ts tests/devops-inspector.test.ts tests/devops-delivery.test.ts tests/explorer.test.ts tests/credits.test.ts tests/cockpit-launcher.test.ts tests/account-credits-monitor.test.ts tests/theme-host.test.ts tests/shortcut-icon.test.ts tests/rewards.test.ts tests/dragonball.test.ts tests/session-hq.test.ts tests/statistics.test.ts tests/images-documents.test.ts tests/proofs.test.ts
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify delivered VSIX
        run: sha256sum -c releases/SHA256SUMS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: npm run check
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - name: Compile the explicitly requested no-test release
        if: env.FEATURE_STUDIO_SKIP_TESTS == 'true'
        run: npm run typecheck && npm run build
      - run: npm install --prefix "${{ runner.temp }}/copilot-catalog" --no-audit --no-fund @github/copilot@1.0.102
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: npx vitest run tests/devops-cli-catalog.test.ts tests/native-runtime.test.ts tests/native-test-runtime.test.ts tests/native-context-runtime.test.ts tests/images-runtime.test.ts tests/task-board-runtime.test.ts
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
        env:
          FEATURE_STUDIO_CATALOG_CLI: ${{ runner.temp }}/copilot-catalog/node_modules/.bin/copilot
      - run: npm run test:ui
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: xvfb-run -a npm run test:extension
        env:
          FEATURE_STUDIO_TEST_NAVIGATION: '1'
        if: env.FEATURE_STUDIO_SKIP_TESTS != 'true'
      - run: mkdir -p releases && npm run package
      - run: python3 scripts/verify-vsix.py --match-build
      - uses: actions/upload-artifact@v4
        if: vars.FEATURE_STUDIO_UPLOAD_ARTIFACTS == 'true'
        with:
          name: feature-studio-vsix
          path: releases/*.vsix
          retention-days: 7
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, windows-cli]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: feature-studio-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare versioned release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const version = pkg.version;
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Expected a stable version');
            const tag = `v${version}`;
            const repo = context.repo;
            const main = await github.rest.git.getRef({ ...repo, ref: 'heads/main' });
            if (main.data.object.sha !== context.sha) {
              core.info('A newer main commit will publish the next release');
              return;
            }
            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ ...repo, tag })).data;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (release && !release.draft) {
              core.info(`${tag} is already published; its assets remain unchanged`);
              return;
            }
            if (release && release.target_commitish !== context.sha) {
              throw new Error('Existing draft targets another commit');
            }
            let tagged;
            try {
              tagged = (await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` })).data.object;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            while (tagged?.type === 'tag') {
              tagged = (await github.rest.git.getTag({ ...repo, tag_sha: tagged.sha })).data.object;
            }
            if (tagged && tagged.sha !== context.sha) throw new Error('Release tag targets another commit');
            fs.accessSync(`docs/releases/${tag}.md`);
            core.setOutput('publish', 'true');
            core.setOutput('version', version);
            core.setOutput('draft-exists', release ? 'true' : 'false');
      - uses: actions/setup-node@v4
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.release.outputs.publish == 'true'
      - run: npm run package
        if: steps.release.outputs.publish == 'true'
      - name: Verify and extract the delivered VSIX
        if: steps.release.outputs.publish == 'true'
        run: |
          python3 - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path

          package = json.loads(Path('package.json').read_text())
          version = package['version']
          vsix = Path(f'releases/feature-studio-{version}.vsix')
          extracted = Path(os.environ['RUNNER_TEMP']) / 'feature-studio-vsix'
          subprocess.run(['python3', 'scripts/verify-vsix.py', str(vsix), '--match-build', '--extract', str(extracted)], check=True)
          output = Path(os.environ['RUNNER_TEMP']) / 'feature-studio-release'
          output.mkdir(exist_ok=True)
          shutil.copy2(vsix, output / vsix.name)
          icon = Path('resources/feature-studio.ico')
          shutil.copy2(icon, output / icon.name)
          digest = hashlib.sha256(vsix.read_bytes()).hexdigest()
          icon_digest = hashlib.sha256(icon.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(f'{digest}  {vsix.name}\n{icon_digest}  {icon.name}\n')
          print(f'Verified {vsix.name}: {vsix.stat().st_size} bytes, SHA-256 {digest}')
          PY
      - name: Install Chromium for packaged navigation verification
        if: steps.release.outputs.publish == 'true' && env.FEATURE_STUDIO_SKIP_TESTS != 'true'
        run: npx playwright install --with-deps chromium
      - name: Load the packaged extension in VS Code
        if: steps.release.outputs.publish == 'true' && env.FEATURE_STUDIO_SKIP_TESTS != 'true'
        run: xvfb-run -a npm run test:extension
        env:
          FEATURE_STUDIO_EXTENSION_PATH: ${{ runner.temp }}/feature-studio-vsix/extension
          FEATURE_STUDIO_TEST_NAVIGATION: '1'
      - name: Publish and verify release assets
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          DRAFT_EXISTS: ${{ steps.release.outputs.draft-exists }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          tag="v$VERSION"
          output="$RUNNER_TEMP/feature-studio-release"
          notes="$RUNNER_TEMP/feature-studio-release-notes.md"
          cp "docs/releases/$tag.md" "$notes"
          printf '\n[CI du commit livré](%s/%s/actions/runs/%s) · Commit `%s`\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" >> "$notes"
          if [ "$DRAFT_EXISTS" = 'true' ]; then
            test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = 'true'
            gh release edit "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Feature Studio $tag" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" "$output/feature-studio-$VERSION.vsix" "$output/feature-studio.ico" "$output/SHA256SUMS" --clobber
          downloaded="$RUNNER_TEMP/feature-studio-downloaded"
          mkdir -p "$downloaded"
          gh release download "$tag" --pattern "feature-studio-$VERSION.vsix" --pattern feature-studio.ico --pattern SHA256SUMS --dir "$downloaded"
          cmp "$output/SHA256SUMS" "$downloaded/SHA256SUMS"
          (cd "$downloaded" && sha256sum -c SHA256SUMS)
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh release edit "$tag" --draft=false --latest
