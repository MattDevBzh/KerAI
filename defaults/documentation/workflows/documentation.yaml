      "description": "Explore le code lié au besoin et ses tests sans le modifier. Recherche sur le web les documentations officielles correspondant aux versions réellement utilisées. Lis les pages avant de les citer. Le code prouve le comportement de l’application ; une documentation externe prouve seulement le contrat externe. Ne présente jamais un test non exécuté comme réussi. Ne transmets ni code privé ni secrets aux moteurs de recherche : requêtes publiques génériques seulement.\nProduis un dossier de recherche : périmètre et public envisagés, inventaire des composants et parcours, faits numérotés, sources code avec projet/chemin/lignes et révision si disponible, sources web avec titre/URL/date de consultation/version, extraits brefs pertinents, divergences et questions. Chaque affirmation importante doit renvoyer à une source réellement consultée. Signale toute recherche inaccessible ou partielle. Aucun terminal, modification, publication, sous-agent ou installation. Le dossier doit être validé humainement avant le plan.",
